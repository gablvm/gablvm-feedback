name: Suggest an idea
description: Something you would like GABLVM to do.
labels: ["idea", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Everything on this page is public, so please do not include anything personal.
  - type: dropdown
    id: product
    attributes:
      label: Is it for the app or the website?
      options:
        - iPhone or iPad app
        - gablvm.org website
        - Both
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and how would it help you?
    validations:
      required: true
