name: Acknowledge new issues
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  acknowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "Thank you for the report. A member of the GABLVM team will read it and reply here.",
              "",
              "If this turns out to be a known issue, we will link it to the existing one so you can follow the fix.",
              "",
              "Known issues: https://github.com/gablvm/gablvm-feedback/issues?q=label%3Aknown-issue",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
